services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: fastfood
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword123}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d fastfood"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DATABASE_URL: postgres://app:${DB_PASSWORD:-devpassword123}@postgres:5432/fastfood?sslmode=disable
      APP_ENV: production
      APP_LOG_LEVEL: info
    volumes:
      - ./files/images:/files/images
    ports:
      - "8080:8080"

