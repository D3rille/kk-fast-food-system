name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a stale run when new commits land on the same branch/PR, so we don't
# burn CI minutes re-checking commits that have already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo, it never pushes commits,
# tags, packages, or comments back to GitHub.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: make vet
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build binary
        run: make build

  test:
    runs-on: ubuntu-latest
    # A sidecar Postgres container reachable at localhost:5432 for the
    # duration of the job. Repository/service tests are stubs today, but
    # this wires up the DB now so nothing needs to change when they land.
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: devpassword123
          POSTGRES_DB: fastfood
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://app:devpassword123@localhost:5432/fastfood?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install golang-migrate CLI
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate
      - name: run migrations
        run: make migrate-up
      - name: run tests
        run: make test
